AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only cross-account role for CloudCost Bharat. Review before deploying.
Parameters:
  TrustedAccountId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: AWS account ID that runs the CloudCost Bharat backend.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Unique external ID generated by the operator.
Resources:
  CloudCostBharatReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudCostBharatReadOnly
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${TrustedAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CloudCostBharatInventoryReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeInstances
                  - cloudwatch:GetMetricStatistics
                Resource: '*'
Outputs:
  RoleArn:
    Description: Use this ARN in the CloudCost Bharat scanner.
    Value: !GetAtt CloudCostBharatReadOnlyRole.Arn
