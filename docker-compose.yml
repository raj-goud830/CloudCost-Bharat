services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_EXTERNAL_ID: ${AWS_EXTERNAL_ID:-}
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
